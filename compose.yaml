x-api: &api
  image: frenschat-day1:${FRENSCHAT_IMAGE_TAG:-current}
  pull_policy: never
  init: true
  environment:
    NODE_ENV: development
    PORT: 5000
    MONGO_URI: mongodb://mongo:27017/frenschat_day1
    JWT_SECRET: local-compose-synthetic-demo-only
    CLIENT_URL: http://localhost:5173
    REDIS_URL: ${FRENSCHAT_REDIS_URL-redis://redis:6379}
    MESSAGE_REPEAT_LIMIT: ${MESSAGE_REPEAT_LIMIT:-}
    MESSAGE_REPEAT_WINDOW_MS: ${MESSAGE_REPEAT_WINDOW_MS:-10000}
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
    interval: 2s
    timeout: 2s
    retries: 20

services:
  api-a:
    <<: *api
    build:
      context: ${FRENSCHAT_BUILD_CONTEXT:-.}
      dockerfile: ${FRENSCHAT_DOCKERFILE:-Dockerfile}
    ports: ["127.0.0.1:5101:5000"]
  api-b:
    <<: *api
    ports: ["127.0.0.1:5102:5000"]
  mongo:
    image: mongo:8.0
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 2s
      timeout: 4s
      retries: 20
  redis:
    image: redis:8.4
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
