name: Quality Gates

on:
  push:
    branches:
      - main
      - redis-kafka-upgrade
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "ci/**"
      - "test/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Audit frontend production dependencies
        run: npm --prefix frontend audit --omit=dev

      - name: Check backend imports
        run: npm run check:backend

      - name: Run backend integration tests
        run: npm run test:backend

      - name: Run socket realtime tests
        run: npm run test:socket

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Build frontend
        run: npm --prefix frontend run build

  distributed-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify shared Redis quota and repeat cooldown
        run: |
          docker compose -p frenschat-day2 up --build --wait
          npm run test:quota -- redis
          MESSAGE_REPEAT_LIMIT=2 docker compose -p frenschat-day2 up -d --wait
          npm run test:quota -- repeat
      - name: Stop Redis test stack
        if: always()
        run: docker compose -p frenschat-day2 stop
      - name: Verify Kafka outage, replay, and dead-letter handling
        run: |
          docker compose -p frenschat-day3 -f compose.yaml -f compose.moderation.yaml up --build --wait
          npm run test:moderation
      - name: Report Kafka test logs on failure
        if: failure()
        run: docker compose -p frenschat-day3 -f compose.yaml -f compose.moderation.yaml --profile moderation logs --tail 40 worker kafka
      - name: Stop Kafka test stack
        if: always()
        run: docker compose -p frenschat-day3 -f compose.yaml -f compose.moderation.yaml --profile moderation stop
